name: Django mylinebot CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check Django
        run: docker compose exec django python3 manage.py check
        
      - name: Run migrations
        run: docker compose exec django python3 manage.py migrate

      - name: Run tests
        run: docker compose exec django python3 manage.py test

      # - name: Stop containers
      #   if: always()
      #   run: docker compose down

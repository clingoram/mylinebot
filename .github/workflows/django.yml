name: Django mylinebot CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker compose -f docker-compose.ci.yml build

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.ci.yml up -d postgres

      - name: Run migrations
        run: docker compose -f docker-compose.ci.yml run --rm django python3 manage.py migrate

      - name: Run tests
        run: docker compose -f docker-compose.ci.yml run --rm django python3 manage.py test

      - name: Django check
        run: docker compose -f docker-compose.ci.yml run --rm django python3 manage.py check

      - name: Show logs if failed
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

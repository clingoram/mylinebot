services:
  django:
    build: .

    command: python3 manage.py test

    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: postgres
      DB_PORT: 5432

      LINE_CHANNEL_ACCESS_TOKEN: ci-test-token
      LINE_CHANNEL_SECRET: ci-test-secret
      WEATHER_ACCESS_TOKEN: ci-test-weather-token

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
